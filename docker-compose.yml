# Geodata 开发环境（W1 基座）
# 用法：docker compose up -d db redis && docker compose up api
# 注意：pgstac 镜像 tag 建议评审后锁定具体小版本（2026-11 检索时点最新 v0.10.x）
services:
  db:
    image: ghcr.io/stac-utils/pgstac:latest
    # pgstac 镜像默认非 root 用户，空卷 initdb 无权写 PGDATA，需 root（入口内部会降权）
    user: root
    environment:
      # 镜像内置 990_pgstac.sh 以 role "postgres" 连接，用户名必须是 postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: geodata
      POSTGRES_DB: geodata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # W2 起 schema 统一经 Alembic 落库（cd backend && DATABASE_URL=... alembic upgrade head），
    # 不再用 initdb 挂载直灌 DDL，保证开发/CI/生产同一迁移路径。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geodata"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://postgres:geodata@db:5432/geodata
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROUTE: object
      # W3：pgSTAC 编目直连 + 本地落盘目录 + 门户下载入口前缀
      PGSTAC_DSN: postgresql://postgres:geodata@db:5432/geodata
      STORAGE_DIR: /data/storage
      PUBLIC_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # W2：USGS 采集 worker（celery -A app.worker.celery_app worker）
  worker:
    build: ./backend
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=info
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://postgres:geodata@db:5432/geodata
      REDIS_URL: redis://redis:6379/0
      PGSTAC_DSN: postgresql://postgres:geodata@db:5432/geodata
      STORAGE_DIR: /data/storage
    volumes:
      - storage_data:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  storage_data:
