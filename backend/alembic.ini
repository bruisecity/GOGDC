# Alembic 迁移框架配置（W2 引入）
# 用法（backend/ 目录下）：
#   DATABASE_URL=postgresql+psycopg://postgres:geodata@localhost:5432/geodata alembic upgrade head
# URL 以环境变量/应用配置为准（见 migrations/env.py），本文件不写死连接串。
[alembic]
script_location = migrations
prepend_sys_path = .
# 由 env.py 从 app.config.settings.database_url 覆盖
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
