# W4 门户前端 nginx：SPA 静态托管 + /api /stac 反代到 api 服务
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # hash 路由 SPA，任何路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 与 /stac 打到后端 api 服务（compose 服务名）
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
    }
    location /stac/ {
        proxy_pass http://api:8000/stac/;
        proxy_set_header Host $host;
    }
}
