name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Lint（编译级检查）
        run: python -m compileall app tests
      - name: Test（含 ORM ↔ DDL 一致性门禁）
        run: python -m pytest tests -q

  migrate-smoke:
    # 在真实 pgSTAC 镜像上执行迁移脚本（W1 验收：pgSTAC 可连通 + DDL 可落库）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations via Alembic（W2：迁移收敛到 Alembic）
        run: |
          # pgstac 镜像三个坑位说明：
          # 1) 较新镜像默认非 root 用户运行，空卷 initdb 无权写 PGDATA 会秒退 -> --user root
          # 2) 内置 990_pgstac.sh 以 role "postgres" 连接 -> POSTGRES_USER 必须是 postgres
          # 3) pgSTAC 由镜像 initdb 脚本以原始 SQL 装载（非 CREATE EXTENSION），等 pgstac schema 出现
          #    即代表初始化真正完成（也避开 initdb 阶段 pg_isready 误报"可连接"的竞态）
          docker run -d --user root --name pg -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=geodata -e POSTGRES_DB=geodata \
            ghcr.io/stac-utils/pgstac:latest
          for i in $(seq 1 60); do
            docker exec pg psql -U postgres -d geodata -tAc \
              "SELECT 1 FROM information_schema.schemata WHERE schema_name='pgstac'" 2>/dev/null \
              | grep -q 1 && break
            sleep 2
          done
          if ! docker ps --filter name=pg --filter status=running --format '{{.Names}}' | grep -q '^pg$'; then
            echo "::error::pg 容器未存活，日志如下"; docker logs pg; exit 1
          fi
          docker exec pg psql -U postgres -d geodata -tAc \
            "SELECT 1 FROM information_schema.schemata WHERE schema_name='pgstac'" | grep -q 1 \
            || { echo "::error::pgstac schema 未出现（初始化未完成或镜像行为变更）"; docker logs pg | tail -50; exit 1; }
          # W2 起 schema 经 Alembic 落库（baseline 执行 sql/000+001，与 ORM 门禁对齐）
          pip install "sqlalchemy>=2.0" "psycopg[binary]>=3.2" "alembic>=1.13"
          cd backend && DATABASE_URL=postgresql+psycopg://postgres:geodata@localhost:5432/geodata \
            alembic upgrade head
          cd .. && docker exec pg psql -U postgres -d geodata -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" | grep -vq '^0$' \
            || { echo "::error::迁移后 public schema 无表"; exit 1; }
          # 终验：postgis 以扩展安装（打印版本），pgstac 以 schema 存在（打印 schema 名）
          docker exec pg psql -U postgres -d geodata -tAc \
            "SELECT extversion FROM pg_extension WHERE extname='postgis'"
          docker exec pg psql -U postgres -d geodata -tAc \
            "SELECT schema_name FROM information_schema.schemata WHERE schema_name='pgstac'"
