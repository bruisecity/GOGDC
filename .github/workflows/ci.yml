name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Lint（编译级检查）
        run: python -m compileall app tests
      - name: Test（含 ORM ↔ DDL 一致性门禁）
        run: python -m pytest tests -q

  migrate-smoke:
    # 在真实 pgSTAC 镜像上执行迁移脚本（W1 验收：pgSTAC 可连通 + DDL 可落库）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run DDL against pgstac image
        run: |
          docker run -d --name pg -e POSTGRES_USER=geodata \
            -e POSTGRES_PASSWORD=geodata -e POSTGRES_DB=geodata \
            ghcr.io/stac-utils/pgstac:latest
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U geodata && break || sleep 2
          done
          docker exec -i pg psql -U geodata -d geodata \
            -v ON_ERROR_STOP=1 -f /dev/stdin \
            < backend/sql/000_extensions.sql
          docker exec -i pg psql -U geodata -d geodata \
            -v ON_ERROR_STOP=1 -f /dev/stdin \
            < backend/sql/001_core_schema.sql
          docker exec pg psql -U geodata -d geodata -tc \
            "SELECT extversion FROM pg_extension WHERE extname='pgstac'"
